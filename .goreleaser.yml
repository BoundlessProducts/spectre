# GoReleaser — builds macOS / Linux / Windows binaries and creates a GitHub Release.
#
# Quick start:
#   brew install goreleaser
#   goreleaser release --snapshot --clean   # local test, no publish
#   GITHUB_TOKEN=<token> goreleaser release --clean   # real publish (needs a tag)

version: 2

project_name: spectre

before:
  hooks:
    - go mod tidy

builds:
  - id: spectre
    binary: spectre
    main: ./cmd/spectre
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - spectre
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - examples/*.spec
      - docs/spectre-book.pdf

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: BoundlessProducts
    name: spectre
  draft: false
  prerelease: auto
  name_template: "Spectre {{ .Version }}"
  header: |
    ## Spectre {{ .Version }}

    Cross-platform CLI for the Spectre formal specification language.

    **Install:**

    ```bash
    # macOS arm64 (Apple Silicon)
    tar xf spectre_{{ .Version }}_darwin_arm64.tar.gz && sudo mv spectre /usr/local/bin/

    # macOS amd64 (Intel)
    tar xf spectre_{{ .Version }}_darwin_amd64.tar.gz && sudo mv spectre /usr/local/bin/

    # Linux amd64
    tar xf spectre_{{ .Version }}_linux_amd64.tar.gz && sudo mv spectre /usr/local/bin/

    # Windows — extract the .zip and add spectre.exe to PATH
    ```

    See [README.md](https://github.com/BoundlessProducts/spectre#installation--macos) for full install instructions including optional backends (TLC, Apalache, Z3).

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

