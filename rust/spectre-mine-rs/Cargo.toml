[package]
name = "spectre-mine-rs"
version = "0.1.0"
edition = "2021"
description = "AST-based Rust source extractor for spectre mine --lang rust"
license = "Apache-2.0"
repository = "https://github.com/BoundlessProducts/spectre"

[[bin]]
name = "spectre-mine-rs"
path = "src/main.rs"

[dependencies]
syn  = { version = "2", features = ["full", "visit"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
quote      = "1"
proc-macro2 = "1"
