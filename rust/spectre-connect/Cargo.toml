[package]
name = "spectre-connect"
version = "0.1.0"
edition = "2021"
description = "Model-based testing bridge: replay Spectre ITF traces against Rust implementations"
license = "Apache-2.0"
repository = "https://github.com/BoundlessProducts/spectre"
keywords = ["formal-verification", "model-based-testing", "spectre", "itf"]
categories = ["development-tools::testing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "counter"
path = "examples/counter.rs"
